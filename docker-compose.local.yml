services:
  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    container_name: vocatree-backend-local
    ports:
      - '8080:8080'
    env_file:
      - .env.mail
    environment:
      - JWT_SECRET_KEY=a-string-secret-at-least-256-bits-long
      - SPRING_PROFILES_ACTIVE=local
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure
    networks:
      - vocatree-network

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    container_name: vocatree-frontend-local
    ports:
      - '3000:3000'
    networks:
      - vocatree-network

  redis:
    image: redis:7-alpine
    container_name: vocatree-redis-local
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vocatree-network

networks:
  vocatree-network:
    driver: bridge
