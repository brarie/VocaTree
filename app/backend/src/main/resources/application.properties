spring.application.name=backend

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.exposed.generate-ddl=true
spring.exposed.show-sql=true
logging.level.Exposed=DEBUG

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

app.certificate-redirect-url=http://localhost:3000/verify
app.jwt.secret-key=a-string-secret-at-least-256-bits-long
app.jwt.access-token-expiration-ms=1800000
app.jwt.refresh-token-expiration-ms=1209600000