spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:vocatree}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&readOnlyPropagatesToServer=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}

  exposed:
    generate-ddl: false
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

logging:
  level:
    Exposed: WARN

app:
  certificate-redirect-url: https://vocatree.com/verify
  data:
    init-enabled: false
  cors:
    allowed-origins: https://vocatree.com,https://www.vocatree.com
