spring:
  application:
    name: backend

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  jwt:
    secret-key: ${JWT_SECRET_KEY:a-string-secret-at-least-256-bits-long}
    access-token-expiration-ms: 1800000
    refresh-token-expiration-ms: 1209600000

  cors:
    allowed-origins: http://localhost:3000
