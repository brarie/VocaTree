spring.application.name=backend-test

spring.h2.console.enabled=false

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.exposed.generate-ddl=true
spring.exposed.show-sql=true
logging.level.Exposed=DEBUG

spring.mail.host=localhost
spring.mail.port=3025

app.certificate-redirect-url=http://localhost:3000/verify

# JWT settings for test
app.jwt.access-token-expiration-ms=60000
app.jwt.refresh-token-expiration-ms=120000
app.jwt.secret-key=test-secret-key-for-jwt-signing-must-be-at-least-256-bits-long